<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Cabañas Huka</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <!-- Logo clickeable apuntando al Inicio -->
        <a href="./index.html" class="logo-link">
            <img src="./logo_Huka.png" alt="Cabañas Huka" class="logo">
        </a>

        <nav>
            <ul>
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./cabanas.html">Nuestras Cabañas</a></li>
                <li><a href="./formulario.html">Reservas y Contacto</a></li>
                
                <!-- Gestión dinámicas de sesión -->
                <li id="menuAcceso"><a href="./login.html">Ingresar / Acceso</a></li>
                <li id="menuCerrarSesion" style="display: none;">
                    <a href="#" onclick="cerrarSesionUsuario()" style="color: #e63946;">Cerrar Sesión</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Reserva de Cabaña</h2>
        <form id="formReserva">
            <div class="form-group">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre">
                <span class="error-msg" id="errorNombre"></span>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="text" id="email">
                <span class="error-msg" id="errorEmail"></span>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono de contacto:</label>
                <div style="display: flex; align-items: center; gap: 5px;">
                    <span style="font-weight: bold;">+56</span>
                    <input type="tel" id="telefono" maxlength="9" placeholder="912345678">
                </div>
                <span class="error-msg" id="errorTelefono"></span>
            </div>

            <div class="form-group">
                <label for="personas">Cantidad de huéspedes:</label>
                <input type="number" id="personas">
                <span class="error-msg" id="errorPersonas"></span>
            </div>

            <button type="button" id="btnValidar" class="btn">Enviar Solicitar Reserva</button>
            <div id="mensajeExito" class="exito-msg"></div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Cabañas Huka. Todos los derechos reservados.</p>
    </footer>

    <!-- Enlace al archivo JavaScript externo -->
    <script src="./formulario.js"></script>
</body>
</html>
